name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install --quiet -r requirements.txt ruff
      - name: Lint (syntax and undefined names)
        run: ruff check --select E9,F63,F7,F82 PM3.py
      - name: Compile
        run: python -m compileall -q PM3.py
